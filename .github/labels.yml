# Repository labels. Apply with `bun scripts/github/sync-labels.ts`.
# `renames` maps GitHub's default labels onto this list. The sync never
# deletes a label that is on an issue or a pull request.

renames:
  bug: "type: fix"
  enhancement: "type: feature"
  documentation: "type: docs"

labels:
  - name: "type: feature"
    color: "1D76DB"
    description: "Pull request work kind: a feature"
  - name: "type: fix"
    color: "D73A4A"
    description: "Pull request work kind: a fix"
  - name: "type: docs"
    color: "0075CA"
    description: "Pull request work kind: documentation"
  - name: "type: refactor"
    color: "FBCA04"
    description: "Pull request work kind: a refactor"
  - name: "type: perf"
    color: "5319E7"
    description: "Pull request work kind: performance"
  - name: "type: test"
    color: "BFDADC"
    description: "Pull request work kind: tests"
  - name: "type: chore"
    color: "CFD3D7"
    description: "Pull request work kind: tooling or maintenance"

  - name: "area: kernel"
    color: "C5DEF5"
    description: "Kernel, fx, and the effect runtime"
  - name: "area: ai"
    color: "C5DEF5"
    description: "AI element, prompts, agents, and deciders"
  - name: "area: http"
    color: "C5DEF5"
    description: "HTTP triggers and the router"
  - name: "area: store"
    color: "C5DEF5"
    description: "Store element and its drivers"
  - name: "area: channel"
    color: "C5DEF5"
    description: "Channel element and its drivers"
  - name: "area: auth"
    color: "C5DEF5"
    description: "Auth, gates, and sign-in"
  - name: "area: compiler"
    color: "C5DEF5"
    description: "Ahead-of-time compiler"
  - name: "area: manifest"
    color: "C5DEF5"
    description: "Manifest derivation and schema"
  - name: "area: cli"
    color: "C5DEF5"
    description: "oke command-line interface"
  - name: "area: console"
    color: "C5DEF5"
    description: "Console UI and its server"
  - name: "area: client"
    color: "C5DEF5"
    description: "Client runtime and React bindings"
  - name: "area: docs"
    color: "C5DEF5"
    description: "Documentation pages"
  - name: "area: site"
    color: "C5DEF5"
    description: "Docs site application"
  - name: "area: ci"
    color: "C5DEF5"
    description: "GitHub workflows, labels, and checks"
  - name: "area: release"
    color: "C5DEF5"
    description: "Version bump, budgets, and GitHub releases"

  - name: "breaking"
    color: "B60205"
    description: "Incompatible change, with a before and after"
  - name: "needs triage"
    color: "D93F0B"
    description: "Missing a type, priority, size, or milestone"
  - name: "needs decision"
    color: "F9D0C4"
    description: "Waiting on a decision before work starts"
  - name: "good first issue"
    color: "7057FF"
    description: "Small, well-defined, and safe for a first change"
  - name: "help wanted"
    color: "008672"
    description: "Help from outside the maintainer set is welcome"
