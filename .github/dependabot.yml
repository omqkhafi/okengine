version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "type: chore"
      - "area: ci"
    milestone: 1
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun:
        patterns:
          - "*"
    labels:
      - "type: chore"
      - "area: ci"
    milestone: 1
