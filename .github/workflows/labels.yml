name: Labels

on:
  push:
    branches: [dev]
    paths:
      - .github/labels.yml
      - scripts/github/sync-labels.ts
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/github/sync-labels.ts
