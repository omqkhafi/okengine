name: Labels

on:
  push:
    branches: [dev]
    paths:
      - .github/labels.yml
      - scripts/github/sync-labels.ts
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/github/sync-labels.ts
