# Comment on pull requests with contract, permission, and effect manifest changes.
# Undeclared contract breaks fail the job. Widening changes are comments only.

name: Manifest diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    name: manifest diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Diff against the merge base
        id: diff
        continue-on-error: true
        run: bun src/cli/manifest-pr-diff.ts manifest-diff.md
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file manifest-diff.md
      - name: Fail undeclared contract breaks
        if: steps.diff.outcome == 'failure'
        run: exit 1
