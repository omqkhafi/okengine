# Comment on pull requests with contract, permission, and effect manifest changes.
# Undeclared contract breaks fail the job. Widening changes are comments only.

name: Manifest diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    name: manifest diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Diff against the merge base
        id: diff
        continue-on-error: true
        run: |
          set +e
          output=$(bun src/cli/manifest-pr-diff.ts manifest-diff.md 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # This repository is the framework, not an app, so there is no manifest to diff.
          if printf '%s\n' "$output" | grep -q "no oke.manifest.json"; then
            echo "no app manifest; skipping"
            exit 0
          fi
          exit "$code"
      - name: Comment
        if: hashFiles('manifest-diff.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file manifest-diff.md
      - name: Fail undeclared contract breaks
        if: steps.diff.outcome == 'failure'
        run: exit 1
