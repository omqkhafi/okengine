name: Project

on:
  issues:
    types: [opened, closed, milestoned, demilestoned]
  pull_request_target:
    types: [opened, closed, milestoned, demilestoned]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  add:
    name: add to project
    runs-on: ubuntu-24.04
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Add to project
        if: github.event.action == 'opened' && env.PROJECT_TOKEN != ''
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/omqkhafi/projects/2
          github-token: ${{ secrets.PROJECT_TOKEN }}

  sync:
    name: sync fields
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PROJECT_TOKEN != ''
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.PROJECT_TOKEN != ''
        with:
          bun-version: "1.4.2"
      - name: Set status and release
        if: env.PROJECT_TOKEN != ''
        run: bun scripts/github/project-event.ts
