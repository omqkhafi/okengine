name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: install · typecheck · test · budgets · gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: CI gate
        run: bun run ci

      - name: Commit budgets.json on main
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- budgets.json; then
            echo "budgets.json unchanged"
          else
            git config user.name "okengine-ci"
            git config user.email "ci@oke.dev"
            git add budgets.json
            git commit -m "chore: update budgets.json snapshot"
            git push
          fi
