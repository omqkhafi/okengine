# Pull-request code checks, in one workflow.
#
# pr-meta.yml stays separate: it also runs when the title, body, labels, or
# milestone change. Putting that trigger here would either re-run this matrix
# or mark these jobs skipped and clear a green required check.
#
# A v* tag runs this file from the release workflow, then publishes.
# Publish jobs are not here, so they do not appear on a pull request.

name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and format
        run: bun run lint && bun run fmt:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test

  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Gate
        run: bun run gate

  site:
    name: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Site build
        run: bun run site:build

  manifest:
    name: manifest diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Diff against the merge base
        id: diff
        continue-on-error: true
        run: |
          if [ ! -f oke.manifest.json ] && [ ! -f manifest.oke.json ]; then
            echo "no app manifest; skipping"
            exit 0
          fi
          bun src/cli/manifest-pr-diff.ts manifest-diff.md
      - name: Comment
        if: hashFiles('manifest-diff.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file manifest-diff.md
      - name: Fail undeclared contract breaks
        if: steps.diff.outcome == 'failure'
        run: exit 1
