name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: install · typecheck · test · budgets · gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: CI gate
        run: bun run ci
