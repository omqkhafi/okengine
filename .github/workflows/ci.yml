# CI gate + publish for okengine and create-oke (npm + JSR, lockstep).
#
# Setup (one-time, platform side — not part of this workflow's gate):
# - JSR: link this repo to @omqkhafi/okengine and @omqkhafi/create-oke
#   (https://jsr.io).
# - npm: configure trusted publisher (OIDC) for this workflow on both
#   `okengine` and `create-oke` package settings. No NPM_TOKEN secret.
#   Trusted publisher: workflow `.github/workflows/ci.yml`, job `publish-npm`.
#
# On push of a version tag (v*): run parallel check jobs, then publish
# both packages to npm and JSR as separate jobs (GitHub Environment
# `production` approval gate).

name: CI

on:
  push:
    tags:
      - "v*"

jobs:
  lint:
    name: lint · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and format
        run: bun run lint && bun run fmt:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test

  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Gate
        run: bun run gate

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Site build
        run: bun run site:build

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, gate, site]
    steps:
      - name: All checks passed
        run: echo ok

  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: ci

    # activates GitHub Environment protections (approvals, env secrets)
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Trusted publishing requires npm CLI >= 11.5.1
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publisher / OIDC)
        run: bun run scripts/publish.ts -- --npm-only --force

  publish-jsr:
    name: Publish JSR
    runs-on: ubuntu-latest
    needs: ci

    # activates GitHub Environment protections (approvals, env secrets)
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish to JSR
        run: bun run scripts/publish.ts -- --jsr-only --force
