name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: install · typecheck · test · budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Client tests
        run: bun run test:client

      - name: Cold-start budget (< 50 ms)
        run: bun run bench:cold-start

      - name: Client bundle budget (< 3 kB gzipped)
        run: bun run bench:client

      - name: Doc-drift (four-applications fences)
        run: bun run test:doc-drift

      - name: Example apps
        run: bun run test:examples

      - name: Skyport oke docker smoke
        run: bun run test:skyport-docker
