name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: install · typecheck · test · cold-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Cold-start budget (< 50 ms)
        run: bun run bench:cold-start
