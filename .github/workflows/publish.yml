# CI gate + publish for okengine and create-oke (npm + JSR, lockstep).
#
# Setup (one-time, platform side — not part of this workflow's gate):
# - JSR: link this repo to @omqkhafi/okengine and @omqkhafi/create-oke
#   (https://jsr.io).
# - npm: configure trusted publisher (OIDC) for this workflow on both
#   `okengine` and `create-oke` package settings. No NPM_TOKEN secret.
#   Trusted publisher job name must match each job below (`publish-npm`).
#
# On pull_request / push: run the full `bun run ci` gate.
# On push to main only: after the gate, publish both packages to npm and JSR
# as separate jobs (GitHub Environment `production` approval gate).

name: CI and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: CI gate
        run: bun run ci

  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: test-and-lint

    # publish only on push to main (not on PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # activates GitHub Environment protections (approvals, env secrets)
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Trusted publishing requires npm CLI >= 11.5.1
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publisher / OIDC)
        run: bun run scripts/publish.ts -- --npm-only --force

  publish-jsr:
    name: Publish JSR
    runs-on: ubuntu-latest
    needs: test-and-lint

    # publish only on push to main (not on PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # activates GitHub Environment protections (approvals, env secrets)
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish to JSR
        run: bun run scripts/publish.ts -- --jsr-only --force
