# Tag release. Runs the CI jobs, then npm and JSR, then the GitHub Release.
# These jobs are not part of a pull request.
#
# npm trusted publishing (OIDC, no NPM_TOKEN) must name this file:
# workflow `.github/workflows/release.yml`, job `publish-npm`,
# for both `okengine` and `create-oke`. JSR packages are linked to this repo.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  checks:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: [publish-npm, publish-jsr]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Create the release and close the milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/github/github-release.ts

  publish-npm:
    name: Publish npm
    needs: checks
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publisher / OIDC)
        run: bun run scripts/publish.ts -- --npm-only --force

  publish-jsr:
    name: Publish JSR
    needs: checks
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish to JSR
        run: bun run scripts/publish.ts -- --jsr-only --force
