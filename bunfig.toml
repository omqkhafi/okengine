[install]
peer = true

[test]
# Project-wide discovery; pass a path (e.g. `bun test src/manifest`) to narrow.
root = "."
coverageSkipTestFiles = true
# store/vault/signal/channel decl registries are shared process-wide across
# every test file — reset them after each test so a bare `store.sql(...)` /
# `vault.secret(...)` / `signal(...)` / `channel.*().template(...)` call in
# one file never leaks into another file's default-registry `oke()`.
preload = ["./src/test/reset-element-registries.ts"]
# Playwright specs use @playwright/test — run via `bun run test:console:smoke`.
# The bundled create-oke starter is not a workspace app.
# Live suites are opt-in (docker, network, provider keys) — not the default `bun test`.
# Do not pass `--path-ignore-patterns` on the CLI: Bun replaces this list instead of extending it.
pathIgnorePatterns = [
  "**/*.live.test.ts",
  "tests/console/**",
  "packages/create-oke/templates/**",
  "examples/**",
  "site/**",
]
