# Generated by `oke docker` / `oke dev --docker`.
# Local overrides: docker-compose.override.yml (do not commit secrets).

name: "oke-dev-7882ce"

networks:
  oke:
    driver: "bridge"
    external: false

services:
  # channel.email — Mailpit (SMTP + UI)
  channel-email:
    image: "axllent/mailpit:v1.22.3"
    ports:
      - "20850:1025"
      - "21850:8025"
    networks:
      - "oke"
    env_file:
      - "../.env.local"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info || exit 1"
      interval: "5s"
      timeout: "3s"
      retries: 10

  # store.files — object storage (S3)
  store-files:
    image: "rustfs/rustfs:1.0.0-beta.11"
    ports:
      - "18850:9000"
      - "19850:9001"
    networks:
      - "oke"
    env_file:
      - "../.env.local"
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY_ID}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_ACCESS_KEY}"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
    command:
      - "/data"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -f http://127.0.0.1:9000/health || exit 1"
      interval: "5s"
      timeout: "5s"
      retries: 12
      start_period: "10s"
    volumes:
      - "store-files-data:/data"

  # store.index — search index
  store-index:
    image: "getmeili/meilisearch:v1.37"
    ports:
      - "8550:7700"
    networks:
      - "oke"
    env_file:
      - "../.env.local"
    environment:
      MEILI_MASTER_KEY: "${OKE_STORE_INDEX_KEY}"
      MEILI_ENV: "${OKE_MEILI_ENV:-production}"
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null http://127.0.0.1:7700/health || exit 1"
      interval: "5s"
      timeout: "3s"
      retries: 12
    volumes:
      - "store-index-data:/meili_data"

  # store.kv — Redis
  store-kv:
    image: "redis:8-alpine"
    ports:
      - "16850:6379"
    networks:
      - "oke"
    env_file:
      - "../.env.local"
    command:
      - "sh"
      - "-c"
      - "exec redis-server --requirepass \"$$OKE_STORE_KV_PASSWORD\" --maxmemory \"$${OKE_STORE_KV_MAXMEMORY:-0}\" --maxmemory-policy \"$${OKE_STORE_KV_MAXMEMORY_POLICY:-noeviction}\""
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "-a"
        - "${OKE_STORE_KV_PASSWORD}"
        - "ping"
      interval: "5s"
      timeout: "3s"
      retries: 10

  # store.sql — Postgres
  store-sql:
    image: "postgres:18-alpine"
    ports:
      - "15850:5432"
    networks:
      - "oke"
    env_file:
      - "../.env.local"
    environment:
      POSTGRES_USER: "${OKE_STORE_SQL_USER}"
      POSTGRES_PASSWORD: "${OKE_STORE_SQL_PASSWORD}"
      POSTGRES_DB: "${OKE_STORE_SQL_DB}"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $$POSTGRES_USER"
      interval: "5s"
      timeout: "3s"
      retries: 10

volumes:
  store-files-data: {}
  store-index-data: {}
